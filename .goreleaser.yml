# GoReleaser v2 configuration.
# Validate with: goreleaser check
# Dry run with:  goreleaser release --snapshot --clean --skip=sign
version: 2

project_name: figctl

before:
  hooks:
    - go mod download

builds:
  - id: figctl
    main: ./cmd/figctl
    binary: figctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Keep these in sync with LDFLAGS in the Makefile.
    ldflags:
      - -s
      - -w
      - -X github.com/tiaanduplessis/figctl/internal/cli.version={{ .Version }}
      - -X github.com/tiaanduplessis/figctl/internal/cli.commit={{ .ShortCommit }}
      - -X github.com/tiaanduplessis/figctl/internal/cli.date={{ .Date }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: figctl
    ids:
      - figctl
    # figctl_0.1.0_darwin_arm64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Sign the checksum file, so a downloaded archive can be traced back to the
# workflow that built it. Keyless signing binds the signature to the GitHub
# Actions identity, which means there is no private key to store or rotate.
# Verify with:
#   cosign verify-blob checksums.txt \
#     --signature checksums.txt.sig --certificate checksums.txt.pem \
#     --certificate-identity-regexp 'https://github.com/tiaanduplessis/figctl/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - "^style:"
      - "^refactor:"
      - "merge conflict"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999

release:
  github:
    owner: tiaanduplessis
    name: figctl
  prerelease: auto
  footer: |
    ## Installation

    ```sh
    go install github.com/tiaanduplessis/figctl/cmd/figctl@{{ .Tag }}
    npx figctl@{{ .Version }} --help
    ```

    Verify a downloaded archive against `checksums.txt`:

    ```sh
    sha256sum -c checksums.txt --ignore-missing
    ```
