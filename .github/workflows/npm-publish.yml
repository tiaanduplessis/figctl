name: publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private == false && vars.PUBLIC_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/check-release.mjs "$RELEASE_TAG"
      - name: Test package
        run: npm test --prefix npm
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false)' | grep -q .
          gh release download "$RELEASE_TAG" --dir release-assets
          cd release-assets
          cosign verify-blob checksums.txt \
            --signature checksums.txt.sig --certificate checksums.txt.pem \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              ext=tar.gz
              if [ "$os" = windows ]; then ext=zip; fi
              asset="figctl_${RELEASE_TAG#v}_${os}_${arch}.${ext}"
              test -s "$asset"
              awk -v name="$asset" '$2 == name { found=1 } END { exit !found }' checksums.txt
            done
          done
          sha256sum --check checksums.txt
      - name: Smoke test the packed installer against GitHub
        run: |
          set -euo pipefail
          npm pack ./npm --pack-destination "$RUNNER_TEMP"
          version=$(node -p "require('./npm/package.json').version")
          mkdir "$RUNNER_TEMP/figctl-smoke"
          cd "$RUNNER_TEMP/figctl-smoke"
          npm install "$RUNNER_TEMP/figctl-${version}.tgz"
          ./node_modules/.bin/figctl version
          ./node_modules/.bin/figctl --help
      - name: Publish through npm trusted publishing
        working-directory: npm
        run: npm publish --access public
