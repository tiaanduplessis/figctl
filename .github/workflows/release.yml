name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    if: github.event.repository.private == false && vars.PUBLIC_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate release version
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - name: Test npm installer
        run: npm test --prefix npm
      - name: Install tools
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.50.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Check
        run: make check
      - name: Vulnerabilities
        run: make vuln

  release:
    environment: release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for keyless signing: cosign exchanges this token for a
      # short lived certificate bound to this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
