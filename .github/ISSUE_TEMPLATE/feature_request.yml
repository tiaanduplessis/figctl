name: Feature request
description: Suggest a change that would help with design-to-code work
title: "[feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult or unavailable today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and show an example if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
